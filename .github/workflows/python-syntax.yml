name: Python syntax check\n\non:\n  push:\n    branches:\n      - main\n      - "refactor/**"\n  pull_request:\n\njobs:\n  syntax:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.11"\n      - name: Compile Python sources\n        run: python -m compileall -q .\n      - name: Verify refactor invariants\n        run: python tests/verify_refactor.py\n
name: Momentum refactor safety

on:
  push:
    branches:
      - "refactor/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Verify Momentum refactor invariants
        run: python tests/verify_refactor.py

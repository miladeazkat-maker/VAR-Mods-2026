name: Build Standalone v1.0.0 Release Preview

on:
  push:
    branches:
      - main
    paths:
      - "MyMods.py"
      - "ModBridge.py"
      - "GLT/**"
      - "HeatMap/**"
      - "MomentumMatch/**"
      - "SAOTMod/**"
      - "RefereeView/**"
      - "PT/**"
      - "Background/**"
      - "packaging/build-standalone.ps1"
      - "packaging/VAR-Mods-2026-standalone.iss"
      - ".github/workflows/build-standalone-release-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for build only
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          choco install innosetup --no-progress -y

      - name: Build standalone applications
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\build-standalone.ps1"
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" "$env:GITHUB_WORKSPACE\packaging\VAR-Mods-2026-standalone.iss"
          if($LASTEXITCODE -ne 0) { throw "Standalone installer build failed." }

      - name: Validate installer contents
        shell: pwsh
        run: |
          $stage = "$env:GITHUB_WORKSPACE\release-stage"
          $forbidden = Get-ChildItem $stage -Recurse -File | Where-Object {
            $_.Name -match '^(python(\.exe|w\.exe|3\d+\.dll)|py\.exe)$' -or $_.Extension -eq ".pyc"
          }
          if($forbidden) {
            $forbidden | Format-Table FullName
            throw "Forbidden Python runtime artifact found in release stage."
          }

      - name: Upload standalone preview
        uses: actions/upload-artifact@v4
        with:
          name: VAR-Mods-2026-v1.0.0-standalone-preview
          path: |
            dist/VAR-Mods-2026-v1.0.0-Setup.exe
            dist/standalone-size-report.txt
          if-no-files-found: error
          retention-days: 14

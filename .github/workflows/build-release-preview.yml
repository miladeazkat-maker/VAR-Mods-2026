name: Build v1.0.0 Release Preview

on:
  push:
    branches:
      - main
    paths:
      - "MyMods.py"
      - "ModBridge.py"
      - "GLT/**"
      - "HeatMap/**"
      - "MomentumMatch/**"
      - "SAOTMod/**"
      - "RefereeView/**"
      - "PT/**"
      - "Background/**"
      - "requirements.txt"
      - "packaging/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller and Inno Setup
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          choco install innosetup --no-progress -y

      - name: Build v1.0.0 installer preview
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\build-release-preview.ps1"

      - name: Upload installer preview
        uses: actions/upload-artifact@v4
        with:
          name: VAR-Mods-2026-v1.0.0-installer-preview
          path: |
            dist/VAR-Mods-2026-v1.0.0-Setup.exe
            dist/v1.0.0-size-report.txt
          if-no-files-found: error
          retention-days: 14

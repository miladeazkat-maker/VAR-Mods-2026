name: Build Python Library Downloader

on:
  push:
    branches:
      - refactor/momentum-modularization
    paths-ignore:
      - "Python Library Downloader.exe"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --windowed --clean --name "Python Library Downloader" Python_Library_Downloader.py
          Copy-Item "dist/Python Library Downloader.exe" "Python Library Downloader.exe" -Force

      - name: Commit rebuilt executable
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Python Library Downloader.exe"
          if (-not (git diff --cached --quiet -- "Python Library Downloader.exe")) {
            git commit -m "Rebuild Python Library Downloader executable"
            git push origin "HEAD:${{ github.ref_name }}"
          } else {
            Write-Host "Executable is already up to date."
          }
